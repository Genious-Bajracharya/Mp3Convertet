<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Downloader</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 100%;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      border-bottom: 2px solid #eee;
    }

    .tab-btn {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: #666;
      padding: 12px 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s;
      margin-bottom: -2px;
    }

    .tab-btn:hover {
      color: #667eea;
      transform: none;
      box-shadow: none;
    }

    .tab-btn.active {
      color: #667eea;
      border-bottom-color: #667eea;
      background: none;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
      animation: fadeIn 0.3s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #333;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 12px;
      border: 2px solid #eee;
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus,
    select:focus {
      outline: none;
      border-color: #667eea;
    }

    .format-options {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .radio-option {
      flex: 1;
      position: relative;
    }

    .radio-option input[type="radio"] {
      display: none;
    }

    .radio-option label {
      display: block;
      padding: 12px;
      border: 2px solid #eee;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      margin: 0;
    }

    .radio-option input[type="radio"]:checked + label {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-bottom: 15px;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      text-align: center;
      display: none;
      font-size: 14px;
    }

    .status.show {
      display: block;
    }

    .status.loading {
      background: #e3f2fd;
      color: #1976d2;
    }

    .status.success {
      background: #e8f5e9;
      color: #388e3c;
    }

    .status.error {
      background: #ffebee;
      color: #d32f2f;
    }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid transparent;
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .info {
      background: #f5f5f5;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      color: #666;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .container {
        padding: 20px;
      }

      h1 {
        font-size: 24px;
      }

      button, input, select {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📥 Media Downloader</h1>
    <p class="subtitle">Download videos from YouTube or TikTok</p>

    <div class="tabs">
      <button type="button" class="tab-btn active" data-tab="youtube">
        ▶️ YouTube
      </button>
      <button type="button" class="tab-btn" data-tab="tiktok">
        🎵 TikTok
      </button>
      <button type="button" class="tab-btn" data-tab="instagram">
        📸 Instagram
      </button>
    </div>

    <!-- YouTube Tab -->
    <div id="youtube" class="tab-content active">
      <form id="youtubeForm">
        <div class="input-group">
          <label for="youtubeUrl">YouTube URL</label>
          <input
            type="text"
            id="youtubeUrl"
            placeholder="https://www.youtube.com/watch?v=..."
            required
          >
        </div>

        <div class="input-group">
          <label>Format</label>
          <div class="format-options">
            <div class="radio-option">
              <input type="radio" id="ytMp3" name="ytFormat" value="mp3" checked>
              <label for="ytMp3">🎵 MP3</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="ytMp4" name="ytFormat" value="mp4">
              <label for="ytMp4">🎬 MP4</label>
            </div>
          </div>
        </div>

        <button type="submit" id="ytDownloadBtn">Download</button>
      </form>
    </div>

    <!-- TikTok Tab -->
    <div id="tiktok" class="tab-content">
      <form id="tiktokForm">
        <div class="input-group">
          <label for="tiktokUrl">TikTok URL</label>
          <input
            type="text"
            id="tiktokUrl"
            placeholder="https://www.tiktok.com/@username/video/..."
            required
          >
        </div>

        <div class="input-group">
          <label>Format</label>
          <div class="format-options">
            <div class="radio-option">
              <input type="radio" id="tkMp4" name="tkFormat" value="mp4" checked>
              <label for="tkMp4">🎬 MP4</label>
            </div>
          </div>
        </div>

        <button type="submit" id="tkDownloadBtn">Download</button>
      </form>
    </div>

    <!-- Instagram Tab -->
    <div id="instagram" class="tab-content">
      <form id="instagramForm">
        <div class="input-group">
          <label for="instagramUrl">Instagram URL</label>
          <input
            type="text"
            id="instagramUrl"
            placeholder="https://www.instagram.com/p/... or /stories/..."
            required
          >
        </div>

        <div class="input-group">
          <label>Type</label>
          <div class="format-options">
            <div class="radio-option">
              <input type="radio" id="igPost" name="igType" value="post" checked>
              <label for="igPost">📸 Post</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="igStory" name="igType" value="story">
              <label for="igStory">📽️ Story</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="igHighlight" name="igType" value="highlight">
              <label for="igHighlight">⭐ Highlight</label>
            </div>
          </div>
        </div>

        <button type="submit" id="igDownloadBtn">Download</button>
      </form>
    </div>

    <div class="status" id="status"></div>

    <div class="info">
      ℹ️ For personal use only.
    </div>
  </div>

  <script>
    const statusDiv = document.getElementById('status');
    const tabButtons = document.querySelectorAll('.tab-btn');
    const tabContents = document.querySelectorAll('.tab-content');

    // Tab switching
    tabButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const tabName = btn.dataset.tab;

        tabButtons.forEach(b => b.classList.remove('active'));
        tabContents.forEach(content => content.classList.remove('active'));

        btn.classList.add('active');
        document.getElementById(tabName).classList.add('active');
      });
    });

    // YouTube form handler
    const youtubeForm = document.getElementById('youtubeForm');
    const youtubeUrlInput = document.getElementById('youtubeUrl');
    const ytDownloadBtn = document.getElementById('ytDownloadBtn');

    youtubeForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = youtubeUrlInput.value.trim();
      const format = document.querySelector('input[name="ytFormat"]:checked').value;
      await handleDownload(url, format, 'YouTube', youtubeUrlInput, ytDownloadBtn);
    });

    // TikTok form handler
    const tiktokForm = document.getElementById('tiktokForm');
    const tiktokUrlInput = document.getElementById('tiktokUrl');
    const tkDownloadBtn = document.getElementById('tkDownloadBtn');

    tiktokForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = tiktokUrlInput.value.trim();
      const format = document.querySelector('input[name="tkFormat"]:checked').value;
      await handleDownload(url, format, 'TikTok', tiktokUrlInput, tkDownloadBtn);
    });

    // Instagram form handler
    const instagramForm = document.getElementById('instagramForm');
    const instagramUrlInput = document.getElementById('instagramUrl');
    const igDownloadBtn = document.getElementById('igDownloadBtn');

    instagramForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = instagramUrlInput.value.trim();
      const igType = document.querySelector('input[name="igType"]:checked').value;
      await handleDownload(url, 'mp4', 'Instagram', instagramUrlInput, igDownloadBtn);
    });

    async function handleDownload(url, format, platform, urlInput, btn) {
      if (!url) {
        showStatus(`Please enter a valid ${platform} URL`, 'error');
        return;
      }

      btn.disabled = true;
      showStatus(`<span class="spinner"></span>Downloading...`, 'loading');

      try {
        const response = await fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, format })
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Download failed');
        }

        const blob = await response.blob();
        const downloadUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = `download.${format}`;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(downloadUrl);
        document.body.removeChild(a);

        showStatus('✓ Download complete!', 'success');
        urlInput.value = '';
      } catch (error) {
        showStatus(`✗ ${error.message}`, 'error');
      } finally {
        btn.disabled = false;
      }
    }

    function showStatus(message, type) {
      statusDiv.innerHTML = message;
      statusDiv.className = `status show ${type}`;
    }
  </script>
</body>
</html>
