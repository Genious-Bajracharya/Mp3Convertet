services:
  - type: web
    name: media-downloader
    env: node
    plan: free
    buildCommand: |
      npm install && \
      apt-get update && \
      apt-get install -y yt-dlp ffmpeg && \
      npm run build 2>/dev/null || true
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
